name: PR validation

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  POETRY_VERSION: "1.8.5"
  # pipx runs Poetry on the system Python, which it would otherwise use for the project too
  POETRY_VIRTUALENVS_PREFER_ACTIVE_PYTHON: "true"

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install "poetry==$POETRY_VERSION"
      - name: Install dependencies
        run: poetry install --no-root
      - name: Run ruff
        run: poetry run ruff format --check .

  wheel:
    name: Wheel installs and diffs on Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check that CHANGELOG.md has notes for this version
        run: python dev/release/notes.py --check
      - name: Install system libraries
        # psycopg2 builds against libpq, and pyodbc needs unixODBC. The Azure mirror fallback is as in "unit"
        run: |
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/' /etc/apt/apt-mirrors.txt
          sudo apt-get update && sudo apt-get install -y libpq-dev unixodbc-dev
      - name: Install Poetry
        run: pipx install "poetry==$POETRY_VERSION"
      - name: Build
        run: poetry build
      - name: Install the wheel in a clean venv and run a diff
        run: python dev/release/smoke_wheel.py dist/*.whl

  unit:
    name: Unit tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Start databases
        run: docker compose up -d --wait --wait-timeout 120 postgres mysql
      - name: Install Poetry
        run: pipx install "poetry==$POETRY_VERSION"
      - name: Install system libraries
        # The runners' Azure Ubuntu mirror stopped resolving on 2026-11-11, and apt doesn't fall back
        run: |
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/' /etc/apt/apt-mirrors.txt
          sudo apt-get update && sudo apt-get install -y libpq-dev unixodbc-dev
      - name: Install dependencies
        run: poetry install
      - name: Run tests
        env:
          TEST_ACROSS_ALL_DBS: "0"
        run: poetry run unittest-parallel -j 4

  integration:
    name: Db2, SQL Server and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Standard runners have 16 GB of memory
      DB2_MEM: 6g
      MSSQL_MEM: 3g
      POSTGRES_MEM: 2g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Start databases
        run: docker compose up -d --wait --wait-timeout 600 postgres mysql mssql db2
      - name: Install ODBC Driver 18 for SQL Server
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/24.04/prod noble main" \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/' /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 libpq-dev unixodbc-dev
      - name: Install Poetry
        run: pipx install "poetry==$POETRY_VERSION"
      - name: Install dependencies
        run: poetry install
      - name: Run tests across every pair of databases
        env:
          TEST_ACROSS_ALL_DBS: full
          DATADIFF_MSSQL_URI: "mssql://sa:Password1@localhost:14330/testdb/dbo?TrustServerCertificate=yes"
          DATADIFF_DB2_URI: "db2://db2inst1:Password1@localhost:50000/testdb/db2inst1"
        run: poetry run unittest-parallel -j 4
      - name: Show database logs
        if: failure()
        run: docker compose logs --tail 100

  sybase:
    name: SAP ASE against Db2, SQL Server and PostgreSQL
    # The ASE image is private. A pull request from a fork gets a token that can't read it,
    # so those skip this job, and sybase-skipped says so in the summary.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    env:
      # Standard runners have 16 GB of memory. ASE fits its image's settings in 2 GB.
      DB2_MEM: 6g
      MSSQL_MEM: 3g
      POSTGRES_MEM: 2g
      MYSQL_MEM: 1g
      ASE_MEM: 2g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start databases
        run: docker compose --profile ase up -d --wait --wait-timeout 600 ase postgres mysql mssql db2
      - name: Install ODBC Driver 18 for SQL Server and FreeTDS
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/24.04/prod noble main" \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/' /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 libpq-dev unixodbc-dev tdsodbc freetds-bin
          odbcinst -q -d
      - name: Install Poetry
        run: pipx install "poetry==$POETRY_VERSION"
      - name: Install dependencies
        run: poetry install
      - name: Run the ASE tests across every pair of databases
        env:
          TEST_ACROSS_ALL_DBS: full
          DATADIFF_MSSQL_URI: "mssql://sa:Password1@localhost:14330/testdb/dbo?TrustServerCertificate=yes"
          DATADIFF_DB2_URI: "db2://db2inst1:Password1@localhost:50000/testdb/db2inst1"
          DATADIFF_SYBASE_URI: "sybase://sa:Password1@localhost:5000/testdb/dbo"
        # Every test with Sybase in its name, plus tests/test_sybase.py
        run: poetry run unittest-parallel -j 4 -k Sybase -k sybase
      - name: Show ASE logs
        if: failure()
        run: docker compose --profile ase logs --tail 200 ase
      - name: Show other database logs
        if: failure()
        run: docker compose logs --tail 100 postgres mssql db2

  sybase-skipped:
    name: SAP ASE (skipped for forks)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Explain the skip
        run: |
          {
            echo "### SAP ASE tests were skipped"
            echo ""
            echo "This pull request comes from a fork. Its token can't pull the private image"
            echo "ghcr.io/bill-ramos-rmoswi/sap-ase, so the ASE job didn't run. A maintainer can run it"
            echo "by pushing the branch to bill-ramos-rmoswi/data-diff."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=SAP ASE tests skipped::Fork pull requests can't pull the private ASE image."

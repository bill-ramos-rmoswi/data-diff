# Adds the development container to the stack in ../docker-compose.yml.
# Relative paths resolve from the repo root, the directory of that first file.
services:
  dev:
    container_name: dd-dev
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    volumes:
      - .:/workspaces/data-diff:cached
      # Claude Code's sessions, plans and login, kept in WSL rather than a Docker volume. It's a separate
      # directory from the WSL ~/.claude, whose plugin records hold WSL paths. Both directories are
      # created by `initializeCommand` in devcontainer.json, and stay empty for someone who doesn't use
      # Claude Code or gh.
      - ${HOME:?run docker compose from WSL, where HOME is set}/.claude-devcontainer:/home/vscode/.claude
      # Shares the WSL `gh auth login`, so it survives a rebuild. Git's name and email need nothing
      # here, because VS Code copies the WSL ~/.gitconfig into the container.
      - ${HOME:?run docker compose from WSL, where HOME is set}/.config/gh:/home/vscode/.config/gh
    environment:
      CLAUDE_CONFIG_DIR: /home/vscode/.claude
      # Compose service names, not localhost. SQL Server uses its container port here.
      DATADIFF_POSTGRESQL_URI: postgresql://postgres:Password1@postgres/postgres
      DATADIFF_MYSQL_URI: mysql://mysql:Password1@mysql/mysql
      DATADIFF_MSSQL_URI: mssql://sa:Password1@mssql:1433/testdb/dbo?TrustServerCertificate=yes
      DATADIFF_DB2_URI: db2://db2inst1:Password1@db2:50000/testdb/db2inst1
      # Needs `docker compose --profile ase up -d --wait ase` from WSL, which needs GHCR access.
      # Without it, unset this to skip ASE.
      DATADIFF_SYBASE_URI: sybase://sa:Password1@ase:5000/testdb/dbo
    networks:
      - local
